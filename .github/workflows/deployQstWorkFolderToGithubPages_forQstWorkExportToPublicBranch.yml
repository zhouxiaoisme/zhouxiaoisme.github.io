name: 部署qstWork子目录到GitHub Pages
on:
  push:
    branches: [ main ]
    paths:
      - 'qstWork/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 步骤1：拉取main分支代码
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # 步骤2：调试 - 确认qstWork存在并复制到临时目录
      - name: 备份qstWork到临时目录
        run: |
          echo "===== 确认main分支下qstWork存在 ====="
          ls -la
          # 创建临时目录，复制qstWork内容（核心：切换分支前先备份）
          mkdir -p /tmp/qstWork_backup
          cp -r qstWork/* /tmp/qstWork_backup/
          echo "===== 临时目录备份的文件 ====="
          ls -la /tmp/qstWork_backup/

      # 步骤3：创建/切换到空分支
      - name: 准备qstWorkExportToPublic分支
        run: |
          # 配置Git身份
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 检查目标分支是否存在，不存在则创建空分支
          if git show-ref --verify --quiet refs/heads/qstWorkExportToPublic; then
            git checkout qstWorkExportToPublic
            # 清空现有内容
            rm -rf * .[!.]*
          else
            git checkout --orphan qstWorkExportToPublic
            git rm -rf .
            git commit --allow-empty -m "初始化qstWorkExportToPublic分支"
          fi

      # 步骤4：从临时目录恢复qstWork内容到当前分支根目录
      - name: 恢复qstWork内容到分支根目录
        run: |
          # 从临时目录复制内容到当前分支根目录
          cp -r /tmp/qstWork_backup/* .
          echo "===== 当前分支根目录最终文件 ====="
          ls -la

      # 步骤5：提交并推送
      - name: 提交并推送变更
        run: |
          git add -A
          # 无变更时跳过提交
          git commit -m "自动部署qstWork: $(date +%Y-%m-%d\ %H:%M:%S)" || echo "无内容变更，无需提交"
          git push -f origin qstWorkExportToPublic

      - name: 部署完成
        run: |
          echo "✅ 部署成功！qstWork内容已推送到qstWorkExportToPublic分支"
          echo "访问地址：https://zhouxiaoisme.github.io"
