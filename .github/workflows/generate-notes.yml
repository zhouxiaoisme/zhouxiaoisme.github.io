name: 递归全目录自动生成笔记列表
on:
  push:
    paths:
      - '**/*.html'
      - '.github/workflows/generate-notes.yml'
  workflow_dispatch:

jobs:
  generate-notes:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 递归扫描所有子目录并生成笔记列表
        run: |
          ##############################################################################
          # 脚本功能：
          # 1. 递归遍历 GitHub 仓库中所有层级的子目录（不限深度）
          # 2. 自动为【每一个目录】生成一个美观的 notes.html 笔记列表页面
          # 3. 页面自动包含：目录标题、文件链接、最后修改日期、返回主页按钮、实时搜索框
          # 4. 自动排除系统目录：.github / .git / node_modules / assets / images
          #
          # 什么是【笔记列表】？
          # 简单说：就是给每个文件夹自动生成一个“目录导航页”，
          # 把文件夹里的所有 .html 文件变成可点击的链接，方便在线浏览学习笔记。
          #
          # 举例说明（三级目录结构）：
          # 根目录
          # └── Python/
          #     └── Basic/
          #         └── Demo/
          #             ├── 变量.html
          #             ├── 循环.jpg
          #             ├── 函数.txt
          #             ├── 模块.doc
          #             ├── 测试.bat
          #             ├── 图片.bmp
          #
          # 脚本执行后会生成：
          # 1. Python/notes.html               → 列出 Python 下所有HTML笔记，带搜索框、日期
          # 2. Python/Basic/notes.html         → 列出 Basic 下所有HTML笔记，带搜索框、日期
          # 3. Python/Basic/Demo/notes.html    → 只列出：变量.html（带日期+搜索过滤），其他文件不显示
          # 所有页面样式统一、可点击、可返回主页、手机电脑自适应、内置实时搜索
          ##############################################################################

          # 排除目录
          EXCLUDE_DIRS=(".github" "node_modules" "assets" "images" ".git")

          # 生成根目录总索引页 index.html ==========================
          cd "$GITHUB_WORKSPACE"
          rm -f index.html
          cat > index.html << EOF
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>学习笔记主页 | 一个普通的思考者</title>
              <style>
                  * { margin:0; padding:0; box-sizing:border-box; font-family: 'PingFang SC','Microsoft YaHei',sans-serif; }
                  body { background: linear-gradient(120deg, #f5f7fa 0%, #e4eaf5 100%); padding:20px; max-width:1000px; margin:0 auto; min-height:100vh; }
                  .container { background:white; border-radius:16px; padding:40px; box-shadow:0 8px 24px rgba(149,157,165,0.15); }
                  .header { text-align:center; margin-bottom:30px; }
                  .avatar { width:120px; height:120px; border-radius:50%; background:linear-gradient(45deg,#4299e1,#38b2ac); margin:0 auto 20px; display:flex; align-items:center; justify-content:center; font-size:48px; color:white; }
                  h1 { font-size:32px; background:linear-gradient(90deg,#2d3748,#4a5568); -webkit-background-clip:text; background-clip:text; color:transparent; }
                  .subtitle { color:#718096; font-size:17px; font-style:italic; }
                  .folder-grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(220px,1fr)); gap:16px; margin-top:20px; }
                  .folder-item { background:#f0f8fb; border-radius:12px; padding:20px; text-align:center; text-decoration:none; color:#2d3748; box-shadow:0 2px 8px rgba(224,231,255,0.5); }
                  .folder-item:hover { transform:translateY(-2px); box-shadow:0 4px 12px rgba(224,231,255,0.8); color:#4299e1; }
                  .folder-icon { font-size:36px; margin-bottom:10px; }
                  .folder-name { font-size:16px; font-weight:500; }
                  .footer { text-align:center; margin-top:30px; color:#718096; font-size:14px; }
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">
                      <div class="avatar">📚</div>
                      <h1>学习笔记总索引</h1>
                      <p class="subtitle">全栈学习笔记 | 持续更新</p>
                  </div>
                  <div class="folder-grid">
          EOF

          # 根目录显示所有一级子目录入口
          find . -maxdepth 1 -type d | grep -v '^\.$' | grep -vE "/(\.github|\.git|node_modules|assets|images)$" | while read -r rootdir; do
              dirname=$(basename "$rootdir")
              cleanname=$(echo "$dirname" | sed 's/Course//g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2)} 1')
              echo "<a class='folder-item' href='$dirname/notes.html'><div class='folder-icon'>📂</div><div class='folder-name'>$cleanname</div></a>" >> index.html
          done

          cat >> index.html << EOF
                  </div>
              </div>
              <div class="footer">一个爱思考、爱较真、爱睡觉的普通人 © 2025</div>
          </body>
          </html>
          EOF
          # 根目录生成完成 ==========================

          # 递归遍历所有目录生成 notes.html
          find . -type d | while read -r dir; do
              # 跳过排除目录
              skip=0
              for ex in "${EXCLUDE_DIRS[@]}"; do
                  if [[ "$dir" == *"/$ex"* ]]; then skip=1; break; fi
              done
              if [ $skip -eq 1 ]; then echo "⏭️ 跳过：$dir"; continue; fi

              echo "========================================"
              echo "📂 处理目录：$dir"
              cd "$dir" || continue

              # 标题处理
              DIR_NAME_CLEAN=$(basename "$dir" | sed 's/Course//g')
              DIR_TITLE=$(echo "$DIR_NAME_CLEAN" | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2)} 1')
              PAGE_TITLE="${DIR_TITLE}学习笔记"
              SUB_TITLE="从底层逻辑拆解${PAGE_TITLE}，较真每一个知识点"

              # 图标
              case $DIR_NAME_CLEAN in
                "python") AVATAR="&#128013;" ;;
                "ai") AVATAR="&#129302;" ;;
                "aigc") AVATAR="&#127912;" ;;
                "java") AVATAR="&#9749;" ;;
                "web") AVATAR="&#127760;" ;;
                *) AVATAR="&#128218;" ;;
              esac

              # 计算返回主页路径
              LEVEL=$(echo "$dir" | grep -o "/" | wc -l)
              BACK_PATH=$(printf "../%.0s" $(seq 1 $LEVEL))
              BACK_LINK="${BACK_PATH}index.html"

              # 生成 notes.html
              rm -f notes.html
              cat > notes.html << EOF
          <!DOCTYPE html>
          <html lang='zh-CN'>
          <head>
              <meta charset='UTF-8'>
              <meta name='viewport' content='width=device-width, initial-scale=1.0'>
              <title>$PAGE_TITLE | 一个普通的思考者</title>
              <style>
                  * { margin:0; padding:0; box-sizing:border-box; font-family: 'PingFang SC','Microsoft YaHei',sans-serif; transition:all 0.3s ease; }
                  body { background: linear-gradient(120deg, #f5f7fa 0%, #e4eaf5 100%); color:#333; padding:20px; max-width:1000px; margin:0 auto; min-height:100vh; }
                  .container { background:rgba(255,255,255,0.95); border-radius:16px; padding:40px; box-shadow:0 8px 24px rgba(149,157,165,0.15); }
                  .header { text-align:center; margin-bottom:25px; }
                  .avatar { width:110px; height:110px; border-radius:50%; background:linear-gradient(45deg,#4299e1,#38b2ac); margin:0 auto 18px; display:flex; align-items:center; justify-content:center; font-size:42px; color:white; }
                  h1 { font-size:28px; background:linear-gradient(90deg,#2d3748,#4a5568); -webkit-background-clip:text; background-clip:text; color:transparent; }
                  .subtitle { color:#718096; font-size:16px; font-style:italic; }
                  .search-box { width:100%; padding:12px 16px; border:1px solid #e2e8f0; border-radius:10px; font-size:15px; margin-bottom:20px; outline:none; }
                  .search-box:focus { border-color:#4299e1; box-shadow:0 0 0 3px rgba(66,153,225,0.15); }
                  .section { margin-bottom:24px; }
                  .section h2 { font-size:20px; margin-bottom:12px; color:#4299e1; border-left:4px solid #4299e1; padding-left:10px; }
                  .list { display:grid; gap:10px; list-style:none; }
                  .list li { background:#f7fafc; border-radius:10px; padding:14px 18px; display:flex; justify-content:space-between; align-items:center; }
                  .list li a { color:#2d3748; text-decoration:none; display:flex; align-items:center; gap:10px; }
                  .list li a:hover { color:#4299e1; }
                  .date { color:#718096; font-size:13px; }
                  .hide { display:none !important; }
                  .empty { text-align:center; padding:20px; color:#a0aec0; }
                  .back { margin-top:25px; text-align:center; }
                  .back a { display:inline-block; padding:10px 22px; background:linear-gradient(90deg,#667eea,#764ba2); color:white; border-radius:8px; text-decoration:none; }
                  .footer { text-align:center; margin-top:20px; color:#718096; font-size:14px; }
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">
                      <div class="avatar">$AVATAR</div>
                      <h1>$PAGE_TITLE</h1>
                      <p class="subtitle">$SUB_TITLE</p>
                  </div>

                  <input type="text" class="search-box" id="search" placeholder="🔍 搜索笔记或子目录...">

                  <!-- 子目录入口 -->
                  <div class="section">
                      <h2>📂 子目录</h2>
                      <ul class="list" id="folderList">
          EOF

              # 列出子目录 ======================
              find . -maxdepth 1 -type d | grep -v '^\.$' | grep -vE "/(\.github|\.git|node_modules|assets|images)$" | sort | while read -r subdir; do
                  name=$(basename "$subdir")
                  cleanname=$(echo "$name" | sed 's/Course//g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2)} 1')
                  echo "<li><a href='$name/notes.html'>📂 $cleanname</a></li>" >> notes.html
              done

              # 分割线
              cat >> notes.html << EOF
                      </ul>
                  </div>

                  <!-- 笔记列表 -->
                  <div class="section">
                      <h2>📄 笔记文件（按最新排序）</h2>
                      <ul class="list" id="fileList">
          EOF

              # 列出 HTML 文件，按【修改时间倒序】最新排在最上面 ======================
              shopt -s nullglob
              ls -t *.html | grep -v "notes.html" | while read -r file; do
                  title=$(echo "$file" | sed 's/\.html//g; s/-/ /g; s/_/ /g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2)} 1')
                  filedate=$(date -r "$file" +'%Y-%m-%d')
                  echo "<li><a href='$file'>📄 $title</a><span class='date'>$filedate</span></li>" >> notes.html
              done
              shopt -u nullglob

              # 尾部 + 搜索JS
              cat >> notes.html << EOF
                      </ul>
                      <div class="empty hide" id="emptyTip">未找到匹配内容</div>
                  </div>

                  <div class="back">
                      <a href="$BACK_LINK">← 返回主页</a>
                  </div>
              </div>

              <div class="footer">一个爱思考、爱较真、爱睡觉的普通人 © 2025</div>

              <script>
                  const search = document.getElementById('search');
                  const folderList = document.getElementById('folderList');
                  const fileList = document.getElementById('fileList');
                  const emptyTip = document.getElementById('emptyTip');

                  search.addEventListener('input', function() {
                      const key = this.value.toLowerCase();
                      let hasMatch = false;

                      // 搜索子目录
                      folderList.querySelectorAll('li').forEach(item => {
                          const text = item.textContent.toLowerCase();
                          const match = text.includes(key);
                          item.classList.toggle('hide', !match);
                          if (match) hasMatch = true;
                      });

                      // 搜索文件
                      fileList.querySelectorAll('li').forEach(item => {
                          const text = item.textContent.toLowerCase();
                          const match = text.includes(key);
                          item.classList.toggle('hide', !match);
                          if (match) hasMatch = true;
                      });

                      emptyTip.classList.toggle('hide', hasMatch);
                  });
              </script>
          </body>
          </html>
          EOF

              cd "$GITHUB_WORKSPACE"
          done

      - name: 提交并推送
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 2>/dev/null
          find . -name "notes.html" -not -path "*/\.*/*" | xargs git add 2>/dev/null
          git commit -m "✨ 终极版：搜索+日期+排序+子目录+根目录索引" || echo "无变更"
          git pull --rebase
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
