<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物框尺寸过滤与抠图指引</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #3498db, #2c3e50);
            color: white;
            padding: 24px 32px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .header-info {
            font-size: 14px;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 6px;
        }
        
        .header-info p {
            margin-bottom: 5px;
        }
        
        .header-info p:last-child {
            margin-bottom: 0;
        }
        
        .process-steps {
            display: flex;
            justify-content: space-between;
            padding: 24px 32px;
            background-color: #f8fafc;
            border-bottom: 1px solid #eef2f7;
        }
        
        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 30%;
            position: relative;
        }
        
        .step:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 20px;
            right: -40%;
            width: 80%;
            height: 2px;
            background: #3498db;
            z-index: 1;
        }
        
        .step-number {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #3498db;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 12px;
            z-index: 2;
        }
        
        .step-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
        }
        
        .step-desc {
            font-size: 13px;
            color: #6b7280;
        }
        
        .visualization {
            padding: 32px;
        }
        
        /* 修复图片容器样式 - 移除固定高度，改为自适应 */
        .image-container {
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            margin-bottom: 24px;
            position: relative;
            border: 1px solid #eef2f7;
            width: 100%;
            /* 移除固定高度，改为自适应 */
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
        }
        
        /* 优化图片样式，保证宽高比且完整显示 */
        .image-container img {
            width: 100%;
            height: auto;
            max-height: 600px; /* 限制最大高度，避免超出可视区域 */
            object-fit: contain; /* 改为contain保证图片完整显示 */
            display: block;
        }
        
        .detection-box {
            position: absolute;
            border: 2px solid #e74c3c;
            background-color: rgba(231, 76, 60, 0.1);
        }
        
        .filtered-box {
            position: absolute;
            border: 2px solid #2ecc71;
            background-color: rgba(46, 204, 113, 0.1);
        }
        
        .padded-cropped-box {
            position: absolute;
            border: 2px solid #9b59b6;
            background-color: rgba(155, 89, 182, 0.1);
            overflow: hidden;
        }
        
        .image-legend {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 10px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            font-size: 13px;
        }
        
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            margin-right: 8px;
        }
        
        .process-description {
            margin-top: 20px;
            font-size: 14px;
            color: #4a5568;
            line-height: 1.6;
            background-color: #e8f4fc;
            border-radius: 8px;
            padding: 20px;
            border-left: 4px solid #3498db;
        }
        
        .scene-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .scene-btn {
            padding: 8px 16px;
            background: white;
            border: 1px solid #d1d9e6;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        
        .scene-btn.active {
            background: #3498db;
            color: white;
            border-color: #3498db;
        }
        
        @media (max-width: 768px) {
            .process-steps {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }
            
            .step {
                width: 100%;
            }
            
            .step:not(:last-child)::after {
                display: none;
            }
            
            .scene-selector {
                flex-direction: column;
                align-items: center;
            }
            
            /* 移动端优化图片最大高度 */
            .image-container img {
                max-height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>物框尺寸过滤与抠图指引</h1>
            <p>展示物框的尺寸过滤与padding抠图效果</p>
        </div>
        
        <div class="process-steps">
            <div class="step">
                <div class="step-number">1</div>
                <div class="step-title">原始检测框</div>
                <div class="step-desc">物体检测模型输出</div>
            </div>
            <div class="step">
                <div class="step-number">2</div>
                <div class="step-title">尺寸过滤</div>
                <div class="step-desc">按宽高阈值过滤</div>
            </div>
            <div class="step">
                <div class="step-number">3</div>
                <div class="step-title">Padding抠图</div>
                <div class="step-desc">扩展像素并抠图输出</div>
            </div>
        </div>
        
        <div class="visualization">
            <div class="scene-selector">
                <div class="scene-btn active" data-scene="human">人员场景</div>
                <div class="scene-btn" data-scene="vehicle">车辆场景</div>
                <div class="scene-btn" data-scene="wupin">物品场景</div>
            </div>
            
            <!-- 人员场景 -->
            <div class="image-container" id="human-scene">
                <img src="./人形大图_1_叠加框效果.png" alt="人员场景示例">
            </div>
        
            <!-- 车辆场景 -->
            <div class="image-container" id="vehicle-scene" style="display: none;">
                <img src="./车辆大图_1_叠加框效果.png" alt="办公室场景示例">
            </div>
            
            <!-- 物品场景 -->
            <div class="image-container" id="wupin-scene" style="display: none;">
                <img src="./全景_1_叠加框效果.png" alt="物品场景示例">
            </div>
            
            <div class="image-legend">
                <div class="legend-item">
                    <div class="legend-color" style="background-color: rgba(231, 76, 60, 0.3); border: 2px solid #e74c3c;"></div>
                    <span>原始检测框</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: rgba(46, 204, 113, 0.3); border: 2px solid #2ecc71;"></div>
                    <span>尺寸过滤后</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: rgba(155, 89, 182, 0.3); border: 2px solid #9b59b6;"></div>
                    <span>Padding抠图区域</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 新增场景切换的JavaScript逻辑 -->
    <script>
        // 获取所有场景按钮和场景容器
        const sceneBtns = document.querySelectorAll('.scene-btn');
        const sceneContainers = document.querySelectorAll('.image-container');

        // 为每个按钮添加点击事件
        sceneBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // 移除所有按钮的active类
                sceneBtns.forEach(b => b.classList.remove('active'));
                // 为当前点击的按钮添加active类
                btn.classList.add('active');
                
                // 获取要显示的场景名称
                const targetScene = btn.dataset.scene;
                
                // 隐藏所有场景容器
                sceneContainers.forEach(container => {
                    container.style.display = 'none';
                });
                
                // 显示目标场景容器
                const targetContainer = document.getElementById(`${targetScene}-scene`);
                if (targetContainer) {
                    targetContainer.style.display = 'flex'; // 与样式中的display保持一致
                }
            });
        });
    </script>
</body>
</html>
